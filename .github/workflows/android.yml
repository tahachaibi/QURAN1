name: android

# Two jobs, on purpose:
#   checks   fast, no Android SDK: typecheck, the full test suite, the data
#            generators re-run from scratch, and the Metro bundle. Catches
#            everything catchable in ~2 minutes.
#   apk      the slow one, and the only place the Kotlin native module actually
#            gets COMPILED. Produces a self-contained, installable APK so the
#            §12 acceptance tests can be run on a real phone without an Expo
#            account, EAS, or a Metro tunnel.
#
# The APK is release-built but signed with the debug keystore (Expo's Android
# template wires release -> signingConfigs.debug), which is what makes it
# installable straight from the artifact zip.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Regenerate bundled data from source
        # Not just "does it parse" — the generators re-derive all 77,429 words
        # and the page tables, then verify_pages asserts 29 hand-checked mushaf
        # facts. A data-source bump that shifts pagination fails here.
        run: npm run gen

      - name: Fail if regenerating the data changed it
        run: |
          if ! git diff --quiet -- src/assets; then
            echo "::error::src/assets differs from what the generators produce. Run 'npm run gen' and commit."
            git diff --stat -- src/assets
            exit 1
          fi

      - name: The committed icons are the ones the generator draws
        # Compares PIXELS, not bytes, and is deliberately NOT part of `npm run
        # gen`. Regenerating the PNGs in CI and diffing them would be a trap:
        # zlib's deflate output is not guaranteed stable across Node versions,
        # so the day CI's Node differs from a contributor's, the bytes stop
        # matching, CI says "regenerate and commit", they do, and it fails again
        # on the next push. Identical images, unfixable loop.
        run: npm run gen:icons-check

      - name: Mushaf layout maps onto the word array with zero drift
        run: npm run gen:layout-check

      - name: Ayah font can render the mushaf, and paints no colours of its own
        run: npm run gen:verify-fonts

      - name: Native module source is committed
        run: test -f modules/expo-arabic-speech/android/src/main/java/com/quranhabit/speech/RecitationRecognizer.kt

      - run: npm run typecheck

      - run: npm test -- --ci

      - name: Engine latency budget
        run: npm run bench

      - name: Store listing fits inside Play's limits
        # Play truncates a title at 30 characters, a short description at 80 and a
        # full description at 4000, and it does it AT UPLOAD — after the build,
        # after the release notes, at the point where you least want to be editing
        # copy. Catching it here costs a second. It has already earned its place:
        # correcting a false privacy claim pushed the English description to 4134.
        run: node store/check-lengths.mjs

      - name: Metro bundle resolves
        run: npm run bundle:check

  quran-model:
    # Tarteel's Quran speech model, exported for the phone and checked on real
    # recitations before any APK may carry it. Only the test APK below uses
    # it; the Play bundle never does.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/quran-model/requirements.txt

      - name: Install the export tools
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install -r scripts/quran-model/requirements.txt
          command -v ffmpeg || { sudo apt-get update && sudo apt-get install -y ffmpeg; }

      - name: Export the model (licence checked first)
        run: python scripts/quran-model/export.py --out out/quran-model

      - name: Check it on recitations, as the phone will run it
        run: python scripts/quran-model/verify.py --dir out/quran-model --cache out/audio

      - uses: actions/upload-artifact@v4
        with:
          name: quran-model
          path: out/quran-model
          if-no-files-found: error
          retention-days: 30

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          # NOT the default 'tools platform-tools'. `tools` is the obsolete SDK
          # Tools package, deprecated for years and now gone from Google's
          # repository, so sdkmanager exits 1 on it and the job dies before it
          # has seen a line of this repo — which is exactly how run 48 failed
          # while the same commit's checks job passed.
          #
          # build-tools is named explicitly, at the version app.json pins, so
          # that aapt2 is GUARANTEED present rather than merely likely: two
          # steps below verify the APK with it, and both used to exit 0 when it
          # was missing. A verification that can silently pass is not one.
          packages: platform-tools build-tools;36.0.0

      - run: npm ci

      - name: Give every build a higher version code than the one before
        # Play refuses any upload whose versionCode it has already seen. A
        # fixed 1 in app.json therefore allows exactly ONE upload, ever, and the
        # second fails in Console with nothing pointing back here. The run
        # number only grows; times ten plus the attempt keeps a re-run of the
        # same commit above its first attempt too.
        run: |
          code=$(( GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT ))
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json','utf8'));j.expo.android.versionCode=$code;fs.writeFileSync('app.json',JSON.stringify(j,null,2)+'\n')"
          echo "versionCode $code"
          echo "versionCode: \`$code\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Prebuild the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Confirm the adhan sound reached res/raw
        # The expo-notifications plugin copies the file listed in app.json's
        # "sounds" into android/app/src/main/res/raw at prebuild, and that copy is
        # the ONLY thing that makes a notification channel able to name it. When
        # the copy silently does not happen the build succeeds and the adhan is
        # silent, which is indistinguishable from the feature not working.
        run: |
          test -f android/app/src/main/res/raw/adhan.mp3 \
            || { echo "adhan sound missing from res/raw — check app.json sounds[]"; exit 1; }
          echo "res/raw/adhan.mp3 $(stat -c%s android/app/src/main/res/raw/adhan.mp3) bytes"

      - name: Confirm the native module source is actually in the repo
        # A .gitignore line of "android/" matches that directory name at ANY
        # depth, which once excluded this entire module from git while it sat
        # happily on disk passing every local check. Assert the Kotlin exists in
        # the CHECKOUT, before anything tries to compile it.
        run: |
          for f in \
            modules/expo-arabic-speech/android/build.gradle \
            modules/expo-arabic-speech/android/src/main/AndroidManifest.xml \
            modules/expo-arabic-speech/android/src/main/java/com/quranhabit/speech/ArabicSpeechModule.kt \
            modules/expo-arabic-speech/android/src/main/java/com/quranhabit/speech/RecitationRecognizer.kt
          do
            test -f "$f" || { echo "::error::$f is missing from the checkout — is it gitignored?"; exit 1; }
          done
          echo "native module source present"

      - name: Confirm autolinking discovers the native module
        # NOT a grep of settings.gradle: Expo's template calls useExpoModules()
        # and never names individual modules, so that check can never pass. Ask
        # autolinking itself instead.
        run: |
          npx expo-modules-autolinking search --platform android --json \
            | node -e "
              let raw = '';
              process.stdin.on('data', (c) => (raw += c));
              process.stdin.on('end', () => {
                const found = Object.keys(JSON.parse(raw));
                if (!found.includes('expo-arabic-speech')) {
                  console.error('::error::expo-arabic-speech was not discovered by autolinking. Found: ' + found.join(', '));
                  process.exit(1);
                }
                console.log('autolinking discovered expo-arabic-speech among ' + found.length + ' modules');
              });
            "

      - uses: gradle/actions/setup-gradle@v4

      - name: Confirm Gradle actually included the module project
        # The definitive linkage check: if useExpoModules() did not include it,
        # this Gradle project simply does not exist and the next step could not
        # compile it.
        working-directory: android
        run: |
          ./gradlew projects --quiet | tee /tmp/projects.txt
          grep -q "expo-arabic-speech" /tmp/projects.txt || {
            echo "::error::Gradle has no :expo-arabic-speech project — useExpoModules() did not include it"
            exit 1
          }

      - name: Compile the Kotlin module on its own first
        # A focused target so a Kotlin error surfaces as a Kotlin error, not
        # buried 400 lines into a full app build.
        working-directory: android
        run: ./gradlew :expo-arabic-speech:compileReleaseKotlin --stacktrace

      - name: Decode the upload keystore, if there is one
        # Play rejects a debug-signed upload outright, and Expo's Android
        # template wires release -> signingConfigs.debug, so every build this
        # repo has ever produced is unpublishable by construction.
        #
        # The four secrets are optional ON PURPOSE. Without them this job still
        # produces the sideloadable debug-signed APK it always did, so a fork, a
        # pull request, and the period before a keystore exists all keep working;
        # with them it additionally produces a signed AAB that Play will accept.
        # The alternative — failing the build until somebody creates a keystore —
        # punishes every contributor for a release step.
        id: keystore
        # Secrets reach the shell as environment variables, never pasted into
        # the script text: GitHub substitutes ${{ }} before bash parses the
        # line, so a password containing $, `, " or \ used to arrive mangled
        # and the error blamed the keystore.
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No UPLOAD_KEYSTORE_BASE64 secret. Building the debug-signed APK only — this cannot be uploaded to Play. See store/README.md."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          # A truncated or mis-pasted secret decodes to something, so check it is
          # really a keystore before handing it to Gradle, where the error would
          # be forty lines of Java stack trace.
          keytool -list -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass:env STORE_PASSWORD >/dev/null || {
            echo "::error::UPLOAD_KEYSTORE_BASE64 did not decode to a keystore readable with UPLOAD_KEYSTORE_PASSWORD"
            exit 1
          }
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the APK
        # Kept alongside the bundle: an AAB cannot be installed on a phone, and
        # the whole point of this job is that §12 can be run on a real device
        # without EAS or a Metro tunnel.
        working-directory: android
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Build the signed App Bundle
        # Play has required an App Bundle for new apps for years; an APK upload
        # is refused. Signing goes through AGP's injected-signing properties
        # rather than by editing build.gradle, because android/ is generated by
        # prebuild and gitignored — anything written into it is destroyed on the
        # next run, which is why a config plugin or a patch script would have
        # been the fragile way to do this.
        if: steps.keystore.outputs.signed == 'true'
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          ./gradlew :app:bundleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Prove the bundle is signed with the upload key, not the debug key
        # The failure this catches is the expensive one: an AAB that builds,
        # uploads, and is rejected by Play with a message about the wrong
        # certificate — after the release notes are written. jarsigner reports
        # the signer's distinguished name, and Android's debug key always
        # identifies itself as CN=Android Debug.
        if: steps.keystore.outputs.signed == 'true'
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "::error::no AAB at $AAB"; exit 1; }
          jarsigner -verify -verbose:summary "$AAB" | tee /tmp/sig.txt
          grep -q "jar verified" /tmp/sig.txt || { echo "::error::the AAB is not signed at all"; exit 1; }
          if grep -qi "CN=Android Debug" /tmp/sig.txt; then
            echo "::error::the AAB is signed with the DEBUG key — Play will reject it"
            exit 1
          fi
          echo "AAB signed with a non-debug certificate"

      - name: The APK asks for exactly the permissions the code uses
        # The MERGED manifest is the only truth, and app.json is not it: the
        # `permissions` array is ADDITIVE into the manifest merge, so a permission
        # a dependency declares cannot be removed by deleting a line from app.json.
        # Measured from node_modules: expo-location declares ACCESS_FINE_LOCATION,
        # expo-file-system declares WRITE_EXTERNAL_STORAGE and READ_EXTERNAL_STORAGE,
        # and the Expo template adds SYSTEM_ALERT_WINDOW. Only `blockedPermissions`
        # removes those, via tools:node="remove" — and whether that survived the
        # merge is exactly the kind of thing that fails silently: the build
        # succeeds and Play shows the user a permission the app never touches.
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort | tail -1)
          if [ -z "$AAPT" ]; then
            echo "::error::aapt2 not found under $ANDROID_HOME/build-tools — this check cannot run, and passing without running it is how the res/raw check once reported a file present twice as missing"
            exit 1
          fi
          "$AAPT" dump permissions "$APK" | tee /tmp/perms.txt

          # Blocked: declared by a dependency or the template, used by no code here.
          for p in ACCESS_FINE_LOCATION SYSTEM_ALERT_WINDOW WRITE_EXTERNAL_STORAGE; do
            if grep -q "android.permission.$p\b" /tmp/perms.txt; then
              echo "::error::$p survived the manifest merge — blockedPermissions did not take"
              exit 1
            fi
          done
          # Never re-added: nothing in this app starts a foreground service.
          # Play Console asks "does your app use advertising ID?" and the
          # honest answer is no. A library that quietly merges the AD_ID
          # permission in would make that answer false, and Play flags the
          # mismatch on upload.
          if grep -q "com.google.android.gms.permission.AD_ID" /tmp/perms.txt; then
            echo "::error::AD_ID is in the merged manifest; add it to blockedPermissions in app.json"
            exit 1
          fi
          for p in FOREGROUND_SERVICE FOREGROUND_SERVICE_MEDIA_PLAYBACK; do
            if grep -q "android.permission.$p\b" /tmp/perms.txt; then
              echo "::error::$p is back, and still nothing calls startForeground"
              exit 1
            fi
          done
          # Load-bearing: each one is used, and losing one breaks a feature quietly.
          #   RECORD_AUDIO         the follow-along
          #   MODIFY_AUDIO_SETTINGS  the native audio-mode repair (earpiece routing)
          #   POST_NOTIFICATIONS   the call to prayer
          #   SCHEDULE_EXACT_ALARM it firing at the right minute
          #   ACCESS_COARSE_LOCATION  which timetable applies
          for p in RECORD_AUDIO MODIFY_AUDIO_SETTINGS POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM ACCESS_COARSE_LOCATION; do
            grep -q "android.permission.$p\b" /tmp/perms.txt \
              || { echo "::error::$p is MISSING from the APK — the feature that needs it is dead"; exit 1; }
          done
          echo "PERMISSION CHECK RAN: $(grep -c uses-permission /tmp/perms.txt) permissions in the merged manifest, all assertions passed"

      - name: Prove the bundled audio is actually inside the APK
        # `require()` returning an asset id proves the bundler SAW the file; it
        # does not prove the file was packaged, and the app cannot tell the
        # difference — it starts "playback" and is silent.
        #
        # Look by RESOURCE NAME, not by path: the Android Gradle plugin shortens
        # resource file paths in a release build, so the payloads land as
        # res/NN.mp3 and res/Z7.mp3. An earlier version of this step grepped for
        # "res/raw/adhan.mp3", found nothing, and reported a missing file that was
        # present twice over.
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          echo "--- audio payloads in the APK ---"
          unzip -l "$APK" | grep -iE '\.(mp3|wav)' || true

          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort | tail -1)
          if [ -z "$AAPT" ]; then
            echo "::error::aapt2 not found under $ANDROID_HOME/build-tools — cannot verify the adhan actually reached the APK, and a silent skip here is indistinguishable from a pass"
            exit 1
          fi
          echo "--- raw resources by NAME (what the runtime looks up) ---"
          "$AAPT" dump resources "$APK" | grep -oE 'raw/[A-Za-z0-9_]+' | sort -u

          # The chime is a JS asset, and how the release build names JS assets is
          # not something I can verify from here — so this warns rather than
          # blocking an otherwise good APK.
          "$AAPT" dump resources "$APK" | grep -qiE 'raw/[a-z0-9_]*test_?tone' \
            && echo "test tone present" \
            || echo "::warning::could not find the test tone by resource name; check the payload list above"

          if [ -f src/assets/audio/adhan.mp3 ]; then
            "$AAPT" dump resources "$APK" | grep -qE 'raw/adhan\b' \
              || { echo "::error::no raw resource named 'adhan' — the notification sound cannot resolve"; exit 1; }
            echo "raw/adhan present"
          else
            echo "no adhan recording bundled in this build"
          fi

      - name: Native libraries are 16 KB page aligned
        # Play refuses an update targeting Android 15+ whose 64-bit native
        # libraries are aligned for 4 KB pages, and it says so only at upload.
        # Two halves: the ELF segments inside each .so, and where zip puts the
        # uncompressed .so inside the APK.
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          python3 scripts/check-elf-alignment.py "$APK"
          ZIPALIGN=$(ls "$ANDROID_HOME"/build-tools/*/zipalign 2>/dev/null | sort | tail -1)
          if [ -z "$ZIPALIGN" ]; then
            echo "::error::zipalign not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          "$ZIPALIGN" -c -P 16 4 "$APK" \
            || { echo "::error::the APK's native libraries are not 16 KB aligned inside the zip"; exit 1; }
          echo "zip alignment: 16 KB"

      - name: Name the artifacts something recognizable
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
             "out/tasmee-hifz-${GITHUB_SHA::7}.apk"
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          if [ -f "$AAB" ]; then
            cp "$AAB" "out/tasmee-hifz-${GITHUB_SHA::7}.aab"
            echo "AAB built: upload the .aab to Play, install the .apk on a phone"
          else
            echo "::notice::APK only. It is debug-signed and Play will refuse it; add the four upload-keystore secrets to get an AAB."
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: tasmee-hifz-apk
          path: out/*
          if-no-files-found: error
          retention-days: 30

  apk-quran:
    # The TEST APK: the same app, plus the built-in Quran model (the files
    # the quran-model job checked, and ONNX Runtime). Sideloaded for
    # comparison only: the Play bundle comes from the apk job and never
    # carries any of it.
    needs: quran-model
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.0.0

      - run: npm ci

      - name: Same version code as the apk job
        run: |
          code=$(( GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT ))
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json','utf8'));j.expo.android.versionCode=$code;fs.writeFileSync('app.json',JSON.stringify(j,null,2)+'\n')"

      - name: Put the checked model where the module's test source set reads it
        uses: actions/download-artifact@v4
        with:
          name: quran-model
          path: modules/expo-arabic-speech/android/src/quranModel/assets/quran-model

      - name: Prebuild the Android project
        run: npx expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the test APK with the model
        working-directory: android
        # arm64 only: every phone of the last several years, and a quarter of
        # the size of a universal APK once ONNX Runtime is in it (it was 251 MB)
        run: ./gradlew :app:assembleRelease -PtasmeeQuranModel=true -PreactNativeArchitectures=arm64-v8a --stacktrace

      - name: The model and ONNX Runtime are inside
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          unzip -l "$APK" | grep -E 'assets/quran-model/|libonnxruntime' | tee /tmp/quran.txt
          for f in features.onnx encoder.onnx decoder.onnx tokens.bin config.json; do
            grep -q "assets/quran-model/$f" /tmp/quran.txt || { echo "::error::$f is missing from the test APK"; exit 1; }
          done
          grep -q 'lib/arm64-v8a/libonnxruntime' /tmp/quran.txt || { echo "::error::ONNX Runtime is missing from the test APK"; exit 1; }
          ls -la "$APK"

      - name: 16 KB alignment (informational; this APK is never uploaded to Play)
        continue-on-error: true
        run: python3 scripts/check-elf-alignment.py android/app/build/outputs/apk/release/app-release.apk

      - name: Name it
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/tasmee-hifz-quran-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: tasmee-hifz-quran-apk
          path: out/*
          if-no-files-found: error
          retention-days: 30

  publish:
    # Its own job, so it waits for BOTH: a build whose tests failed must never
    # replace the APK on the phone link or the AAB the Play guide says to
    # upload. The apk job still starts at once, in parallel with checks.
    # Only from the development branch, so a pull request can never replace it.
    # The test APK is waited for, but a failure there never holds back the
    # normal APK and the Play bundle.
    needs: [checks, apk, apk-quran]
    if: >-
      always() && needs.checks.result == 'success' && needs.apk.result == 'success' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/claude/quran-habit-android-jr6hwv'
    runs-on: ubuntu-latest
    # write, only so this job can publish the phone download
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tasmee-hifz-apk
          path: out

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: tasmee-hifz-quran-apk
          path: out

      - name: Publish the APK at one fixed link a phone can open
        # An artifact arrives as a zip, needs a GitHub login, and moves to a new
        # URL on every run. Installing from a phone should be one tap on a link
        # that never changes:
        #   https://github.com/<owner>/<repo>/releases/download/test-build/tasmee-hifz.apk
        # A pre-release, so nobody mistakes it for a store launch. Only from
        # the development branch, so a pull request can never replace it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          cp "out/tasmee-hifz-${GITHUB_SHA::7}.apk" out/tasmee-hifz.apk
          files=(out/tasmee-hifz.apk)
          # The signed bundle too, so uploading to Play is also one link:
          #   …/releases/download/test-build/tasmee-hifz.aab
          if [ -f "out/tasmee-hifz-${GITHUB_SHA::7}.aab" ]; then
            cp "out/tasmee-hifz-${GITHUB_SHA::7}.aab" out/tasmee-hifz.aab
            files+=(out/tasmee-hifz.aab)
          fi
          # The test APK with the built-in Quran model, when it built:
          #   …/releases/download/test-build/tasmee-hifz-quran.apk
          if [ -f "out/tasmee-hifz-quran-${GITHUB_SHA::7}.apk" ]; then
            cp "out/tasmee-hifz-quran-${GITHUB_SHA::7}.apk" out/tasmee-hifz-quran.apk
            files+=(out/tasmee-hifz-quran.apk)
          fi
          gh release delete test-build --yes --cleanup-tag -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create -R "$GITHUB_REPOSITORY" test-build "${files[@]}" \
            --prerelease --target "$GITHUB_SHA" \
            --title "Test build ${GITHUB_SHA::7}" \
            --notes "Latest build of Tasmee Hifz from commit ${GITHUB_SHA::7}. On a phone: download tasmee-hifz.apk and open it. For Play Console: upload tasmee-hifz.aab."
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/test-build/tasmee-hifz.apk"
          echo "Phone download: $url"
          echo "### Install on a phone" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
