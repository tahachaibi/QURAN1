name: android

# Two jobs, on purpose:
#   checks   fast, no Android SDK: typecheck, the full test suite, the data
#            generators re-run from scratch, and the Metro bundle. Catches
#            everything catchable in ~2 minutes.
#   apk      the slow one, and the only place the Kotlin native module actually
#            gets COMPILED. Produces a self-contained, installable APK so the
#            §12 acceptance tests can be run on a real phone without an Expo
#            account, EAS, or a Metro tunnel.
#
# The APK is release-built but signed with the debug keystore (Expo's Android
# template wires release -> signingConfigs.debug), which is what makes it
# installable straight from the artifact zip.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Regenerate bundled data from source
        # Not just "does it parse" — the generators re-derive all 77,429 words
        # and the page tables, then verify_pages asserts 29 hand-checked mushaf
        # facts. A data-source bump that shifts pagination fails here.
        run: npm run gen

      - name: Fail if regenerating the data changed it
        run: |
          if ! git diff --quiet -- src/assets; then
            echo "::error::src/assets differs from what the generators produce. Run 'npm run gen' and commit."
            git diff --stat -- src/assets
            exit 1
          fi

      - name: Mushaf layout maps onto the word array with zero drift
        run: npm run gen:layout-check

      - name: Ayah font can render the mushaf, and paints no colours of its own
        run: npm run gen:verify-fonts

      - name: Native module source is committed
        run: test -f modules/expo-arabic-speech/android/src/main/java/com/quranhabit/speech/RecitationRecognizer.kt

      - run: npm run typecheck

      - run: npm test -- --ci

      - name: Engine latency budget
        run: npm run bench

      - name: Metro bundle resolves
        run: npm run bundle:check

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Prebuild the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Confirm the adhan sound reached res/raw
        # The expo-notifications plugin copies the file listed in app.json's
        # "sounds" into android/app/src/main/res/raw at prebuild, and that copy is
        # the ONLY thing that makes a notification channel able to name it. When
        # the copy silently does not happen the build succeeds and the adhan is
        # silent, which is indistinguishable from the feature not working.
        run: |
          test -f android/app/src/main/res/raw/adhan.mp3 \
            || { echo "adhan sound missing from res/raw — check app.json sounds[]"; exit 1; }
          echo "res/raw/adhan.mp3 $(stat -c%s android/app/src/main/res/raw/adhan.mp3) bytes"

      - name: Confirm the native module source is actually in the repo
        # A .gitignore line of "android/" matches that directory name at ANY
        # depth, which once excluded this entire module from git while it sat
        # happily on disk passing every local check. Assert the Kotlin exists in
        # the CHECKOUT, before anything tries to compile it.
        run: |
          for f in \
            modules/expo-arabic-speech/android/build.gradle \
            modules/expo-arabic-speech/android/src/main/AndroidManifest.xml \
            modules/expo-arabic-speech/android/src/main/java/com/quranhabit/speech/ArabicSpeechModule.kt \
            modules/expo-arabic-speech/android/src/main/java/com/quranhabit/speech/RecitationRecognizer.kt
          do
            test -f "$f" || { echo "::error::$f is missing from the checkout — is it gitignored?"; exit 1; }
          done
          echo "native module source present"

      - name: Confirm autolinking discovers the native module
        # NOT a grep of settings.gradle: Expo's template calls useExpoModules()
        # and never names individual modules, so that check can never pass. Ask
        # autolinking itself instead.
        run: |
          npx expo-modules-autolinking search --platform android --json \
            | node -e "
              let raw = '';
              process.stdin.on('data', (c) => (raw += c));
              process.stdin.on('end', () => {
                const found = Object.keys(JSON.parse(raw));
                if (!found.includes('expo-arabic-speech')) {
                  console.error('::error::expo-arabic-speech was not discovered by autolinking. Found: ' + found.join(', '));
                  process.exit(1);
                }
                console.log('autolinking discovered expo-arabic-speech among ' + found.length + ' modules');
              });
            "

      - uses: gradle/actions/setup-gradle@v4

      - name: Confirm Gradle actually included the module project
        # The definitive linkage check: if useExpoModules() did not include it,
        # this Gradle project simply does not exist and the next step could not
        # compile it.
        working-directory: android
        run: |
          ./gradlew projects --quiet | tee /tmp/projects.txt
          grep -q "expo-arabic-speech" /tmp/projects.txt || {
            echo "::error::Gradle has no :expo-arabic-speech project — useExpoModules() did not include it"
            exit 1
          }

      - name: Compile the Kotlin module on its own first
        # A focused target so a Kotlin error surfaces as a Kotlin error, not
        # buried 400 lines into a full app build.
        working-directory: android
        run: ./gradlew :expo-arabic-speech:compileReleaseKotlin --stacktrace

      - name: Build the APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prove the bundled audio is actually inside the APK
        # `require()` returning an asset id proves the bundler SAW the file; it
        # does not prove the file was packaged, and the app cannot tell the
        # difference — it starts "playback" and is silent.
        #
        # Look by RESOURCE NAME, not by path: the Android Gradle plugin shortens
        # resource file paths in a release build, so the payloads land as
        # res/NN.mp3 and res/Z7.mp3. An earlier version of this step grepped for
        # "res/raw/adhan.mp3", found nothing, and reported a missing file that was
        # present twice over.
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          echo "--- audio payloads in the APK ---"
          unzip -l "$APK" | grep -iE '\.(mp3|wav)' || true

          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort | tail -1)
          if [ -z "$AAPT" ]; then
            echo "aapt2 not found; skipping the resource-name check"
            exit 0
          fi
          echo "--- raw resources by NAME (what the runtime looks up) ---"
          "$AAPT" dump resources "$APK" | grep -oE 'raw/[A-Za-z0-9_]+' | sort -u

          # The chime is a JS asset, and how the release build names JS assets is
          # not something I can verify from here — so this warns rather than
          # blocking an otherwise good APK.
          "$AAPT" dump resources "$APK" | grep -qiE 'raw/[a-z0-9_]*test_?tone' \
            && echo "test tone present" \
            || echo "::warning::could not find the test tone by resource name; check the payload list above"

          if [ -f src/assets/audio/adhan.mp3 ]; then
            "$AAPT" dump resources "$APK" | grep -qE 'raw/adhan\b' \
              || { echo "::error::no raw resource named 'adhan' — the notification sound cannot resolve"; exit 1; }
            echo "raw/adhan present"
          else
            echo "no adhan recording bundled in this build"
          fi

      - name: Name the artifact something installable
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
             "out/quran-habit-${GITHUB_SHA::7}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: quran-habit-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
